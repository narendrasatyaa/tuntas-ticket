{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TUNTAS IT Helpdesk System</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'images/logo-tuntas.png' %}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            },
            colors: {
              teal: {
                50: '#f0fdfa',
                100: '#ccfbf1',
                200: '#99f6e4',
                500: '#14b8a6',
                600: '#0d9488',
                700: '#0f766e',
              }
            }
          }
        }
      }
    </script>

    <!-- Theme Detect (Light/Dark) -->
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/reactbits.css' %}">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .bg-mesh-dark {
            background-color: #0b0f19;
            background-image: 
                radial-gradient(at 0% 0%, rgba(13, 148, 136, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(30, 41, 59, 0.3) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(20, 184, 166, 0.05) 0px, transparent 70%);
        }
        .bg-mesh-light {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(204, 251, 241, 0.6) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(226, 232, 240, 0.5) 0px, transparent 50%);
        }
    </style>
</head>
<body class="bg-mesh-light dark:bg-mesh-dark text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6 antialiased selection:bg-teal-500 selection:text-white transition-colors duration-300">


    <!-- Main Centered Container -->
    <main class="w-full max-w-md mx-auto my-auto py-6">
        <div class="relative rounded-3xl bg-white/95 dark:bg-[#111827]/90 backdrop-blur-xl border border-slate-200/90 dark:border-slate-800/90 shadow-2xl p-7 sm:p-9 space-y-6 overflow-hidden">
            <!-- Card Header -->
            <div class="text-center space-y-2">
                <div class="inline-flex items-center justify-center p-3 rounded-2xl shadow-sm mb-1">
                    <img src="{% static 'images/logo-tuntas.png' %}" alt="Tuntas" class="w-10 h-10 object-contain" />
                </div>
                <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">Login Pengguna</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400 max-w-xs mx-auto leading-relaxed">Masuk ke portal IT Service Desk untuk pelaporan & monitoring tiket kendala.</p>
            </div>

            <!-- Error Notification Alert -->
            {% if form.errors %}
                <div class="p-3.5 rounded-2xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200/90 dark:border-rose-800/70 text-rose-700 dark:text-rose-300 text-xs flex items-center gap-3 animate-shake">
                    <i data-lucide="alert-circle" class="w-4 h-4 text-rose-500 flex-shrink-0"></i>
                    <span class="font-medium">Username atau password salah. Silakan periksa kembali.</span>
                </div>
            {% endif %}

            <!-- Login Form -->
            <form method="post" action="{% url 'login' %}" class="space-y-4">
                {% csrf_token %}

                <!-- Username Input -->
                <div class="space-y-1.5">
                    <label for="id_username" class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300">
                        Username
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 dark:text-slate-500">
                            <i data-lucide="user" class="w-4 h-4"></i>
                        </div>
                        <input type="text" name="username" id="id_username" required autofocus
                               class="w-full pl-10 pr-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-medium bg-slate-50 dark:bg-slate-900/80 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-500/20 transition-all" placeholder="Masukkan Username">
                    </div>
                </div>

                <!-- Password Input -->
                <div class="space-y-1.5">
                    <div class="flex items-center justify-between">
                        <label for="id_password" class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300">
                            Password
                        </label>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 dark:text-slate-500">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </div>
                        <input type="password" name="password" id="id_password" required
                               class="w-full pl-10 pr-10 py-2.5 rounded-xl text-xs sm:text-sm font-medium bg-slate-50 dark:bg-slate-900/80 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-500/20 transition-all"
                               placeholder="••••••••">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors" title="Lihat password">
                            <i data-lucide="eye" id="toggle-pwd-icon" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full mt-2 py-3 px-4 rounded-xl text-xs sm:text-sm font-bold text-white bg-teal-600 hover:bg-teal-500 active:bg-teal-700 shadow-md shadow-teal-600/25 transition-all flex items-center justify-center gap-2 cursor-pointer">
                    <span>Masuk ke Dashboard</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

        </div>
    </main>

    <!-- Bottom Footer -->
    <footer class="w-full text-center py-3 text-xs text-slate-400 dark:text-slate-500 flex items-center justify-center gap-2">
        <img src="{% static 'images/logo-tuntas.png' %}" alt="Tuntas" class="w-3.5 h-3.5 object-contain opacity-80" />
        <span><strong class="text-slate-700 dark:text-slate-300">TUNTAS.</strong> &copy; 2026 Internal IT Helpdesk System.</span>
    </footer>

    <!-- Scripts -->
    <script>
        // Init Lucide Icons
        lucide.createIcons();

        // Quick Autofill for Demo Accounts
        function quickFill(username) {
            document.getElementById('id_username').value = username;
            document.getElementById('id_password').value = 'password123';
            document.getElementById('id_username').focus();
        }

        // Toggle Password Visibility
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('id_password');
            const icon = document.getElementById('toggle-pwd-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                pwdInput.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        // Theme Toggle Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        function updateThemeIcons() {
            if (document.documentElement.classList.contains('dark')) {
                themeToggleLightIcon.classList.remove('hidden');
                themeToggleDarkIcon.classList.add('hidden');
            } else {
                themeToggleLightIcon.classList.add('hidden');
                themeToggleDarkIcon.classList.remove('hidden');
            }
        }

        updateThemeIcons();

        themeToggleBtn.addEventListener('click', function() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
            updateThemeIcons();
            lucide.createIcons();
        });
    </script>
</body>
</html>
